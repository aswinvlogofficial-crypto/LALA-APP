import 'package:flutter/material.dart';

void main() {
  runApp(const LalaApp());
}

class LalaApp extends StatelessWidget {
  const LalaApp({super.key});

  static const Color navyBg = Color(0xFF071126);
  static const Color navyCard = Color(0xFF0E1D3D);
  static const Color navySurface = Color(0xFF152954);
  static const Color goldAccent = Color(0xFFE5B84B);
  static const Color goldSoft = Color(0xFFF3D27A);

  @override
  Widget build(BuildContext context) {
    final baseScheme = ColorScheme.fromSeed(
      seedColor: goldAccent,
      brightness: Brightness.dark,
      primary: goldAccent,
      onPrimary: navyBg,
      secondary: goldSoft,
      surface: navyCard,
    );

    return MaterialApp(
      title: 'LALA APP - Loan & Streaming Hub',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(
        useMaterial3: true,
        brightness: Brightness.dark,
        colorScheme: baseScheme,
        scaffoldBackgroundColor: navyBg,
        cardColor: navyCard,
        appBarTheme: const AppBarTheme(
          backgroundColor: navyBg,
          foregroundColor: goldSoft,
          elevation: 0,
          centerTitle: false,
        ),
        inputDecorationTheme: InputDecorationTheme(
          filled: true,
          fillColor: navySurface,
          labelStyle: const TextStyle(color: Colors.white70),
          hintStyle: const TextStyle(color: Colors.white38),
          enabledBorder: OutlineInputBorder(
            borderRadius: BorderRadius.circular(12),
            borderSide: BorderSide(color: goldAccent.withValues(alpha: 0.35)),
          ),
          focusedBorder: OutlineInputBorder(
            borderRadius: BorderRadius.circular(12),
            borderSide: const BorderSide(color: goldAccent, width: 1.8),
          ),
        ),
        elevatedButtonTheme: ElevatedButtonThemeData(
          style: ElevatedButton.styleFrom(
            backgroundColor: goldAccent,
            foregroundColor: navyBg,
            textStyle: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15),
            padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 14),
            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
          ),
        ),
      ),
      home: const LoginScreen(),
    );
  }
}

class LoginScreen extends StatefulWidget {
  const LoginScreen({super.key});

  @override
  State<LoginScreen> createState() => _LoginScreenState();
}

class _LoginScreenState extends State<LoginScreen> {
  final TextEditingController _phoneController = TextEditingController();
  final TextEditingController _inviteController = TextEditingController();

  static const String requiredInviteCode = 'LALA123';
  double _slideValue = 0.0;
  String _statusMessage = '';

  @override
  void dispose() {
    _phoneController.dispose();
    _inviteController.dispose();
    super.dispose();
  }

  void _attemptEnterApp() {
    final String phone = _phoneController.text.trim();
    final String invite = _inviteController.text.trim().toUpperCase();

    if (phone.length < 10) {
      setState(() {
        _slideValue = 0.0;
        _statusMessage = 'Sahi phone number (kam se kam 10 ank) daalein.';
      });
      return;
    }

    if (invite != requiredInviteCode) {
      setState(() {
        _slideValue = 0.0;
        _statusMessage = 'Galat Invite Code! Sirf reference code $requiredInviteCode se entry milegi.';
      });
      return;
    }

    Navigator.pushReplacement(
      context,
      MaterialPageRoute(
        builder: (_) => MainDashboard(userPhone: phone),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: SafeArea(
        child: SingleChildScrollView(
          padding: const EdgeInsets.all(20),
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              const SizedBox(height: 24),
              Container(
                padding: const EdgeInsets.all(20),
                decoration: BoxDecoration(
                  color: LalaApp.navyCard,
                  borderRadius: BorderRadius.circular(20),
                  border: Border.all(color: LalaApp.goldAccent.withValues(alpha: 0.45)),
                ),
                child: Column(
                  children: const [
                    Icon(Icons.shield_moon_rounded, size: 54, color: LalaApp.goldAccent),
                    SizedBox(height: 10),
                    Text(
                      'LALA APP',
                      style: TextStyle(
                        fontSize: 26,
                        fontWeight: FontWeight.w800,
                        letterSpacing: 1.5,
                        color: LalaApp.goldSoft,
                      ),
                    ),
                    SizedBox(height: 4),
                    Text(
                      'Android 17 Navy & Gold Edition • Invite Only',
                      style: TextStyle(fontSize: 13, color: Colors.white70),
                    ),
                  ],
                ),
              ),
              const SizedBox(height: 24),
              TextField(
                controller: _phoneController,
                keyboardType: TextInputType.phone,
                decoration: const InputDecoration(
                  labelText: 'Phone Number',
                  hintText: '9876543210',
                  prefixIcon: Icon(Icons.phone_android, color: LalaApp.goldAccent),
                ),
              ),
              const SizedBox(height: 14),
              TextField(
                controller: _inviteController,
                textCapitalization: TextCapitalization.characters,
                decoration: const InputDecoration(
                  labelText: 'Invite Code',
                  hintText: 'LALA123',
                  prefixIcon: Icon(Icons.vpn_key_rounded, color: LalaApp.goldAccent),
                ),
              ),
              const SizedBox(height: 22),
              Container(
                padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
                decoration: BoxDecoration(
                  color: LalaApp.navyCard,
                  borderRadius: BorderRadius.circular(14),
                  border: Border.all(color: LalaApp.goldAccent.withValues(alpha: 0.3)),
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: const [
                        Text(
                          'Slide to Login',
                          style: TextStyle(color: LalaApp.goldSoft, fontWeight: FontWeight.w600),
                        ),
                        Text(
                          'Ant tak slide karein',
                          style: TextStyle(color: Colors.white54, fontSize: 12),
                        ),
                      ],
                    ),
                    Slider(
                      value: _slideValue,
                      min: 0.0,
                      max: 1.0,
                      activeColor: LalaApp.goldAccent,
                      inactiveColor: LalaApp.navySurface,
                      onChanged: (val) {
                        setState(() {
                          _slideValue = val;
                          _statusMessage = '';
                        });
                      },
                      onChangeEnd: (val) {
                        if (val >= 0.85) {
                          setState(() => _slideValue = 1.0);
                          _attemptEnterApp();
                        } else {
                          setState(() => _slideValue = 0.0);
                        }
                      },
                    ),
                  ],
                ),
              ),
              const SizedBox(height: 12),
              ElevatedButton(
                onPressed: _attemptEnterApp,
                child: const Text('Unlock & Login'),
              ),
              if (_statusMessage.isNotEmpty) ...[
                const SizedBox(height: 14),
                Container(
                  padding: const EdgeInsets.all(12),
                  decoration: BoxDecoration(
                    color: Colors.redAccent.withValues(alpha: 0.15),
                    borderRadius: BorderRadius.circular(10),
                    border: Border.all(color: Colors.redAccent.withValues(alpha: 0.5)),
                  ),
                  child: Text(
                    _statusMessage,
                    style: const TextStyle(color: Colors.redAccent, fontSize: 13),
                  ),
                ),
              ],
            ],
          ),
        ),
      ),
    );
  }
}

